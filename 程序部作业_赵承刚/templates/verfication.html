{% extends 'base.html' %}

{% block content %}
<h1>邮箱验证</h1>
<p>我们已向您的邮箱 <strong>{{ user.email }}</strong> 发送了验证码，请在10分钟内完成验证。</p >

<form method="post">
    {% csrf_token %}
    
    <div class="form-group">
        <label for="id_code">验证码</label>
        {{ form.code }}
    </div>
    
    <button type="submit" class="btn">验证</button>
    
    <div class="resend-link">
        <p>没有收到验证码？<a href="{% url 'resend_code' user.id %}">重新发送</a ></p >
    </div>
</form>
{% endblock %}
